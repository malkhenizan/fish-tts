# Coolify: enable Git submodules (recursive) so fish-speech/ is present at build time.
# Coolify Docker Compose — Fish TTS wrapper (RTX 3090 / CUDA)
#
# Coolify notes:
# - Attach your domain to service `fish-tts` on port 8080
# - Set API_KEY (and optional HF_TOKEN) in Coolify environment variables
# - Ensure the Coolify host has NVIDIA Container Toolkit installed

services:
  fish-tts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VER: "12.6.0"
        UV_EXTRA: "cu126"
        PY_VER: "3.12"
    image: fish-tts:coolify
    container_name: fish-tts
    restart: unless-stopped

    # Older Docker / some Coolify hosts still honor runtime
    runtime: nvidia

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      FISH_SPEECH_HOST: "127.0.0.1"
      FISH_SPEECH_PORT: "8081"
      DEVICE: "cuda"
      COMPILE: "1"
      HALF: "0"
      API_KEY: "${API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      # Survive rebuilds / redeploys
      - fish_tts_checkpoints:/app/checkpoints
      - fish_tts_voices:/app/voices

    # Compose GPU reservation (Swarm-compatible; also respected by recent Compose)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  fish_tts_checkpoints:
  fish_tts_voices:
