# Coolify Docker Compose — Fish TTS wrapper (RTX 3090 / CUDA)
#
# Coolify notes:
# - Do NOT publish host ports (ports:). Coolify's proxy attaches to the
#   container network and will fail if 8080 is already bound on the host.
# - In Coolify UI: set domain → service fish-tts → port 8080
# - Set API_KEY (and optional HF_TOKEN) as env vars
# - Host needs NVIDIA Container Toolkit

services:
  fish-tts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep these non-empty — Coolify bake overrides Dockerfile ARG defaults with ""
        UV_EXTRA: "cu126"
        PY_VER: "3.12"
        FISH_SPEECH_REF: "main"
    image: fish-tts:coolify
    restart: unless-stopped

    # Older Docker / some Coolify hosts still honor runtime
    runtime: nvidia

    # Expose to Coolify network only — do not bind 0.0.0.0:8080 on the host
    expose:
      - "8080"

    environment:
      PORT: "8080"
      FISH_SPEECH_HOST: "127.0.0.1"
      FISH_SPEECH_PORT: "8081"
      DEVICE: "cuda"
      COMPILE: "1"
      HALF: "0"
      API_KEY: "${API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      - fish_tts_checkpoints:/app/checkpoints
      - fish_tts_voices:/app/voices

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  fish_tts_checkpoints:
  fish_tts_voices:
